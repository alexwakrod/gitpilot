[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpilot-ai"
version = "0.1.1"
description = "Local AI-powered Git auto-committer daemon"
authors = [{ name = "Alex Wakrod", email = "alexwakrod@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["readme"]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "duckdb>=0.9.0",
    "watchdog>=3.0.0",
    "click>=8.1.0",
    "rich>=13.5.0",
    "httpx>=0.25.0",
    "gitpython>=3.1.40",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "readchar>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx-mock>=0.11.0",
    "pyinstaller>=5.13.0",
]

[project.scripts]
gitpilot = "gitpilot.cli.main:cli"
gitpilotd = "gitpilot.daemon.server:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }