<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gp-title">
  <title id="gp-title">GitPilot logo — a git commit node with a dotted flight path leading to a paper plane</title>
  <defs>
    <linearGradient id="gp-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="gp-accent" x1="150" y1="360" x2="400" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="gp-plane" x1="309" y1="99" x2="399" y2="189" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="gp-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 112) scale(120)">
      <stop stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app-icon plate -->
  <rect width="512" height="512" rx="116" fill="url(#gp-bg)"/>

  <!-- ambient glow behind the plane -->
  <circle cx="360" cy="112" r="120" fill="url(#gp-glow)"/>

  <!-- flight path: dotted route from the commit node to the plane -->
  <path d="M150 360 C160 272 228 252 278 212 C306 189 312 164 314 138"
        stroke="url(#gp-accent)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="0.1 32" fill="none"/>

  <!-- origin commit node -->
  <circle cx="150" cy="360" r="30" stroke="url(#gp-accent)" stroke-width="16"/>
  <circle cx="150" cy="360" r="10" fill="url(#gp-accent)"/>

  <!-- commit along the way -->
  <circle cx="231" cy="249" r="13" fill="url(#gp-accent)"/>

  <!-- paper plane -->
  <path d="M399 99 L367.5 189 L349.5 148.5 L309 130 L399 99 Z" fill="url(#gp-plane)"/>
  <path d="M399 99 L349.5 148.5" stroke="#0F172A" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>
</svg>